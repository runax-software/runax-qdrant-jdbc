# Local Qdrant for trying the driver and for integration tests.
#   docker compose up -d
#   gRPC API (what the driver uses) on localhost:6334
#   REST API on http://localhost:6333, web dashboard on http://localhost:6333/dashboard
#   docker compose down -v   # stop and delete the stored collections
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # A second server that requires an API key, for the authentication integration tests.
  # gRPC on localhost:6336, REST on localhost:6335. It keeps no data between runs.
  qdrant-secured:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6335:6333"
      - "6336:6334"
    environment:
      QDRANT__SERVICE__API_KEY: integration-test-key

volumes:
  qdrant-data:
