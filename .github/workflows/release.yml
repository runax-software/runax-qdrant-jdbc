name: Release

# Pushing a tag such as v0.1.0 builds the driver jar for that version and publishes it as a
# GitHub release, with the tag's section of CHANGELOG.md as the notes. CI has already run on the
# commit through main; the build here runs the unit tests again before anything is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the driver jar
        run: ./gradlew build shadowJar -PreleaseVersion="${GITHUB_REF_NAME#v}"

      # The section under "## [x.y.z]" in CHANGELOG.md, up to the next version's heading
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/qdrant-jdbc-${GITHUB_REF_NAME#v}-all.jar" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
