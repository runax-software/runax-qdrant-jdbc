name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One job per LTS JDK. The driver compiles for Java 17 (options.release) whichever JDK runs
  # the build, so each job checks it compiles warning-free and passes the unit tests on that JDK.
  build-and-test-matrix:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compiles with -Werror, runs the unit tests (no Qdrant needed) and builds the jars.
      - name: Build and unit tests
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-java-${{ matrix.java }}
          path: build/reports/tests/test

  # Aggregate gate so branch protection can require the stable context "build-and-test"
  # instead of the per-JDK matrix contexts. No name: field, so the context stays "build-and-test".
  build-and-test:
    runs-on: ubuntu-latest
    needs: [build-and-test-matrix]
    if: always()

    steps:
      - name: Verify matrix result
        run: |
          if [ "${{ needs.build-and-test-matrix.result }}" != "success" ]; then
            echo "::error::build-and-test-matrix did not succeed (result: ${{ needs.build-and-test-matrix.result }})"
            exit 1
          fi

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v7

      # Java 17, the release the driver targets.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Both servers from compose.yml: qdrant (REST 6333) and qdrant-secured (REST 6335, API key).
      # /readyz answers without the API key, so the same probe works for both.
      - name: Start Qdrant
        run: |
          docker compose up -d
          for port in 6333 6335; do
            ready=
            for _ in $(seq 1 30); do
              if curl -sf "http://localhost:$port/readyz" >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then echo "::error::Qdrant on port $port did not become ready"; exit 1; fi
          done

      # Also builds the shaded jar and checks it in its own class loader, the way DataGrip loads it.
      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Qdrant logs
        if: failure()
        run: docker compose logs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: build/reports/tests/integrationTest
