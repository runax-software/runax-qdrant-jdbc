version: 2
updates:
  # Gradle dependencies, plugins, and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - chore
    assignees:
      - Katyara11
    commit-message:
      prefix: build
    groups:
      test:
        patterns:
          - "org.junit*"

  # The Qdrant image in compose.yml.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - chore
    assignees:
      - Katyara11
    commit-message:
      prefix: build

  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - chore
    assignees:
      - Katyara11
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
